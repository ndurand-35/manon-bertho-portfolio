name: Optimiser les images

# Quand une image est ajoutée ou modifiée dans public/uploads (depuis Tina ou à la main),
# génère sa version WebP dans public/optimized et met à jour lib/image-manifest.json.
on:
  push:
    branches: [main]
    paths:
      - "public/uploads/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer sharp
        run: npm install --prefix /tmp/sharp sharp@0.33.5
      - name: Générer les versions optimisées
        env:
          SHARP_PATH: /tmp/sharp/node_modules/sharp/lib/index.js
        run: node scripts/optimize-images.mjs
      - name: Enregistrer les changements
        run: |
          git add public/optimized lib/image-manifest.json
          if git diff --cached --quiet; then
            echo "Rien à optimiser."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Optimisation automatique des images"
          git pull --rebase
          git push
